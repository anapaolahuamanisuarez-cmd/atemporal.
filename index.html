<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEMPORAL — Matriz de Eisenhower</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --transition: all 0.25s ease;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 8px 0;
        }

        .slogan {
            color: var(--text-muted);
            margin: 0 0 12px 0;
        }

        .fecha {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
        }

        /* Formulario de Nueva Tarea */
        .form-tarea {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .inputs-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .inputs-row input[type="text"] { flex: 2; min-width: 200px; }
        .inputs-row input[type="datetime-local"] { flex: 1; min-width: 180px; }

        input[type="text"], input[type="datetime-local"] {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Estructura de la Matriz Dinámica */
        .matriz-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .matriz-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .cuadrante {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-top: 5px solid var(--border);
            min-height: 200px;
        }

        /* Colores de los cuadrantes */
        #urgente-importante { border-top-color: #ef4444; }      /* Hazlo ya */
        #importante-no-urgente { border-top-color: #3b82f6; }   /* Planifícalo */
        #urgente-no-importante { border-top-color: #f59e0b; }   /* Delégalo */
        #no-urgente-no-importante { border-top-color: #10b981; }/* Elimínalo */

        .cuadrante h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.15rem;
            display: flex;
            justify-content: space-between;
            color: #1e293b;
        }

        .contador {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 12px;
            background: #f8fafc;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        .tarea-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tarea-fecha {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .completada {
            background: #e2e8f0;
            opacity: 0.5;
        }
        
        .completada .tarea-texto {
            text-decoration: line-through;
        }

        .actions-div {
            display: flex;
            gap: 6px;
        }

        .btn-check { background-color: var(--success); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background-color: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>ATEMPORAL</h1>
        <p class="slogan">Organiza tus días. Construye tu futuro.</p>
        <p class="fecha" id="fecha-actual"></p>
    </header>

    <main>
        <!-- Formulario Inteligente -->
        <div class="form-tarea">
            <h3>Añadir Nueva Tarea Inteligente</h3>
            <div class="inputs-row">
                <input type="text" id="nueva-tarea" placeholder="¿Qué tienes que hacer?">
                <input type="datetime-local" id="fecha-tarea">
            </div>
            <div class="checkbox-row">
                <label><input type="checkbox" id="check-importante"> ⭐ ¿Es Importante?</label>
                <label><input type="checkbox" id="check-urgente"> ⚡ ¿Es Urgente?</label>
                <button onclick="agregarTareaWeb()" style="margin-left: auto;">Guardar Tarea</button>
            </div>
        </div>

        <!-- Panel de Matriz de Eisenhower -->
        <div class="matriz-container">
            
            <!-- Cuadrante 1 -->
            <div class="cuadrante" id="urgente-importante">
                <h3>🔴 Importante y Urgente <span class="contador" id="c1-count">0</span></h3>
                <ul id="lista-c1"></ul>
            </div>

            <!-- Cuadrante 2 -->
            <div class="cuadrante" id="importante-no-urgente">
                <h3>🔵 Importante pero NO Urgente <span class="contador" id="c2-count">0</span></h3>
                <ul id="lista-c2"></ul>
            </div>

            <!-- Cuadrante 3 -->
            <div class="cuadrante" id="urgente-no-importante">
                <h3>🟡 Urgente pero NO Importante <span class="contador" id="c3-count">0</span></h3>
                <ul id="lista-c3"></ul>
            </div>

            <!-- Cuadrante 4 -->
            <div class="cuadrante" id="no-urgente-no-importante">
                <h3>🟢 Ni Importante ni Urgente <span class="contador" id="c4-count">0</span></h3>
                <ul id="lista-c4"></ul>
            </div>

        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
