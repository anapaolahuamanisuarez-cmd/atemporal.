<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEMPORAL — Panel de Control</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --transition: all 0.25s ease;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 8px 0;
        }

        .slogan {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0 0 12px 0;
        }

        .fecha {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .grid-layout { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }

        .seccion {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .seccion:hover {
            transform: translateY(-2px);
        }

        .flex-input {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input, select {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 14px;
            background: #f8fafc;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }

        .completada {
            background: #e2e8f0;
            opacity: 0.6;
            border-left-color: var(--text-muted);
        }
        
        .completada span {
            text-decoration: line-through;
        }

        .btn-check { background-color: var(--success); }
        .btn-delete { background-color: var(--danger); }

        .actions-div {
            display: flex;
            gap: 6px;
        }

        .grid-finanzas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .tarjeta-financiera {
            padding: 16px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
        }
        .ingresos-bg { background: #d1fae5; color: #065f46; }
        .gastos-bg { background: #fee2e2; color: #991b1b; }
        .balance-bg { background: #e0f2fe; color: #075985; }
    </style>
</head>
<body>

    <header>
        <h1>ATEMPORAL</h1>
        <p class="slogan">Organiza tus días. Construye tu futuro.</p>
        <p class="fecha" id="fecha-actual"></p>
    </header>

    <main class="grid-layout">
        <div class="seccion">
            <h3>📌 Mis Tareas</h3>
            <div class="flex-input">
                <input type="text" id="nueva-tarea" placeholder="¿Qué tienes que hacer hoy?">
                <button onclick="agregarTareaWeb()">Agregar</button>
            </div>
            <ul id="lista-tareas"></ul>
        </div>

        <div class="seccion">
            <h3>🎯 Mis Objetivos</h3>
            <div class="flex-input">
                <input type="text" id="nuevo-objetivo" placeholder="Escribe un gran objetivo...">
                <button onclick="agregarObjetivoWeb()">Agregar</button>
            </div>
            <ul id="lista-objetivos"></ul>
        </div>

        <div class="seccion">
            <h3>⚡ Mis Hábitos</h3>
            <div class="flex-input">
                <input type="text" id="nuevo-habito" placeholder="Ej: Beber agua, Ejercicio...">
                <button onclick="agregarHabitoWeb()">Crear</button>
            </div>
            <ul id="lista-habitos"></ul>
        </div>

        <div class="seccion full-width">
            <h3>💰 Mis Finanzas</h3>
            <div class="flex-input">
                <select id="tipo-movimiento">
                    <option value="ingreso">Ingreso (+)</option>
                    <option value="gasto">Gasto (-)</option>
                </select>
                <input type="number" id="cantidad-movimiento" placeholder="Monto S/" step="0.01">
                <input type="text" id="desc-movimiento" placeholder="Descripción">
                <button onclick="agregarMovimientoWeb()">Registrar</button>
            </div>
            <div class="grid-finanzas">
                <div class="tarjeta-financiera ingresos-bg">Ingresos<br><span id="fin-ingresos">S/ 0.00</span></div>
                <div class="tarjeta-financiera gastos-bg">Gastos<br><span id="fin-gasto">S/ 0.00</span></div>
                <div class="tarjeta-financiera balance-bg">Balance<br><span id="fin-balance">S/ 0.00</span></div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
