<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEMPORAL — Panel de Control Gamificado</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --transition: all 0.25s ease;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 8px 0;
        }

        .slogan { color: var(--text-muted); margin: 0 0 12px 0; }

        .marcador-puntos {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.25);
        }

        .marcador-puntos span {
            background: white;
            color: var(--primary);
            padding: 2px 12px;
            border-radius: 30px;
        }

        .fecha { display: block; margin-top: 10px; color: var(--text-muted); font-weight: 600; }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .grid-layout { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }

        .seccion {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .seccion:hover { transform: translateY(-2px); }
        h3 { color: #1e293b; margin-top: 0; margin-bottom: 15px; }

        .flex-input { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        input, select { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; min-width: 120px; }
        
        button { padding: 12px 20px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        button:hover { background-color: var(--primary-hover); }

        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 12px; background: #f8fafc; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }

        .completada { background: #e2e8f0; opacity: 0.6; border-left-color: var(--text-muted); }
        .completada span { text-decoration: line-through; }
        .vencida { background: #fee2e2; border-left-color: var(--danger); }

        .btn-check { background-color: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .actions-div { display: flex; gap: 6px; }

        .grid-finanzas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
        .tarjeta-financiera { padding: 16px; border-radius: 10px; font-weight: 700; text-align: center; }
        .ingresos-bg { background: #d1fae5; color: #065f46; }
        .gastos-bg { background: #fee2e2; color: #991b1b; }
        .balance-bg { background: #e0f2fe; color: #075985; }
    </style>
</head>
<body>

    <header>
        <h1>ATEMPORAL</h1>
        <p class="slogan">Organiza tus días. Construye tu futuro.</p>
        <div class="marcador-puntos">🏆 Puntos: <span id="puntos-total">0</span> | Rango: <span id="rango-jugador">Novato</span></div>
        <span class="fecha" id="fecha-actual"></span>
    </header>

    <main class="grid-layout">
        <!-- TAREAS INTELIGENTES -->
        <div class="seccion full-width">
            <h3>📌 Mis Tareas e Importancia Cruzada</h3>
            <div class="flex-input">
                <input type="text" id="nueva-tarea" placeholder="¿Qué tienes que hacer hoy?">
                <input type="datetime-local" id="fecha-tarea">
                <select id="select-importante"><option value="no">No Importante</option><option value="si">⭐ Importante</option></select>
                <select id="select-urgente"><option value="no">No Urgente</option><option value="si">⚡ Urgente</option></select>
                <button onclick="agregarTareaWeb()">Agregar Tarea</button>
            </div>
            <ul id="lista-tareas"></ul>
        </div>

        <!-- OBJETIVOS -->
        <div class="seccion">
            <h3>🎯 Mis Objetivos</h3>
            <div class="flex-input">
                <input type="text" id="nuevo-objetivo" placeholder="Escribe un gran objetivo...">
                <button onclick="agregarObjetivoWeb()">Agregar</button>
            </div>
            <ul id="lista-objetivos"></ul>
        </div>

        <!-- HÁBITOS -->
        <div class="seccion">
            <h3>⚡ Mis Hábitos</h3>
            <div class="flex-input">
                <input type="text" id="nuevo-habito" placeholder="Ej: Beber agua, Ejercicio...">
                <button onclick="agregarHabitoWeb()">Crear</button>
            </div>
            <ul id="lista-habitos"></ul>
        </div>

        <!-- FINANZAS -->
        <div class="seccion full-width">
            <h3>💰 Mis Finanzas</h3>
            <div class="flex-input">
                <select id="tipo-movimiento">
                    <option value="ingreso">Ingreso (+)</option>
                    <option value="gasto">Gasto (-)</option>
                </select>
                <input type="number" id="cantidad-movimiento" placeholder="Monto S/" step="0.01">
                <input type="text" id="desc-movimiento" placeholder="Descripción">
                <button onclick="agregarMovimientoWeb()">Registrar</button>
            </div>
            <div class="grid-finanzas">
                <div class="tarjeta-financiera ingresos-bg">Ingresos<br><span id="fin-ingresos">S/ 0.00</span></div>
                <div class="tarjeta-financiera gastos-bg">Gastos<br><span id="fin-gasto">S/ 0.00</span></div>
                <div class="tarjeta-financiera balance-bg">Balance<br><span id="fin-balance">S/ 0.00</span></div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
